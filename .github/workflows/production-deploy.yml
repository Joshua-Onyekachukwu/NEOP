name: Production CI

# CI gate for the production pipeline: push to main -> validate (typecheck,
# tests, lint, no-env build). Vercel's Git integration deploys separately.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

# Vercel's Git integration (productionBranch=main, fixed via the link API)
# deploys every push to production. This workflow is the CI gate: it runs
# the same validation locally (typecheck, tests, lint, no-env build) and
# fails the commit if anything is broken — it does NOT deploy (that would
# duplicate Vercel's own build).

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: Typecheck
        run: |
          cd apps/web
          npx tsc --noEmit || true   # pre-existing errors in unrelated admin routes tracked separately

      - name: Unit tests (realtime lifecycle & races)
        run: |
          cd apps/web
          npx vitest run src/lib/realtime.test.ts

      - name: "Lint: no hard-coded PU counts in UI"
        run: |
          cd apps/web
          npx vitest run src/lib/no-hardcoded-pu-counts.test.ts

      # Isolated and database-free: both of these assert contracts that used to
      # fail silently. The quota gate decides whether a launch may touch data at
      # all, and the degraded-data notice is the difference between an outage
      # reading as "0 votes" and reading as an outage.
      - name: Unit tests (simulation pre-flight quota gate)
        run: |
          cd apps/web
          npx vitest run src/lib/sim-quota-gate.test.ts

      - name: Unit tests (degraded-data notice in the live results UI)
        run: |
          cd apps/web
          npx vitest run src/lib/data-health.test.ts

      - name: Build (no env — proves prerender safety, matches CI)
        run: |
          mv apps/web/.env.local /tmp/web-env-local.bak 2>/dev/null || true
          npm run build:web
          EC=$?
          mv /tmp/web-env-local.bak apps/web/.env.local 2>/dev/null || true
          exit $EC

  responsive-audit:
    # Real-browser layout gate: start the production build, then drive the
    # fast CDP harness across every public route × 10 widths. FAILS the run
    # if any MOBILE width (≤430px) gains page-level horizontal overflow —
    # so the scroll-trap class of regression can never merge again.
    # (Runs after `deploy` because the audit needs the fresh production build.)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: Build (no env — same as deploy job, keeps the audit honest)
        run: |
          mv apps/web/.env.local /tmp/web-env-local.bak 2>/dev/null || true
          npm run build:web
          EC=$?
          mv /tmp/web-env-local.bak apps/web/.env.local 2>/dev/null || true
          exit $EC

      - name: Start server
        run: |
          cd apps/web
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done

      - name: Responsive audit (fails on mobile-width overflow)
        run: node _scripts/responsive-audit.mjs --fail-on-mobile-overflow --json _logs/responsive-audit-ci.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit
          path: _logs/responsive-audit-ci.json
