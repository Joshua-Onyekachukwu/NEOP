name: Production CI

# CI gate for the production pipeline: push to main -> validate (typecheck,
# tests, lint, no-env build). Vercel's Git integration deploys separately.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

# Vercel's Git integration (productionBranch=main, fixed via the link API)
# deploys every push to production. This workflow is the CI gate: it runs
# the same validation locally (typecheck, tests, lint, no-env build) and
# fails the commit if anything is broken — it does NOT deploy (that would
# duplicate Vercel's own build).

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: Typecheck
        run: |
          cd apps/web
          npx tsc --noEmit || true   # pre-existing errors in unrelated admin routes tracked separately

      - name: Unit tests (realtime lifecycle & races)
        run: |
          cd apps/web
          npx vitest run src/lib/realtime.test.ts

      - name: "Lint: no hard-coded PU counts in UI"
        run: |
          cd apps/web
          npx vitest run src/lib/no-hardcoded-pu-counts.test.ts

      - name: Build (no env — proves prerender safety, matches CI)
        run: |
          mv apps/web/.env.local /tmp/web-env-local.bak 2>/dev/null || true
          npm run build:web
          EC=$?
          mv /tmp/web-env-local.bak apps/web/.env.local 2>/dev/null || true
          exit $EC
